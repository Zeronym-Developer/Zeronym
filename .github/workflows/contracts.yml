name: Contract build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked contract dependencies
        run: node scripts/ci/install-pool.mjs
      - name: Compile contracts
        run: npm --prefix contracts/pool run compile
      - name: Check compiler version and contract interfaces
        run: node scripts/ci/check-contracts.mjs
